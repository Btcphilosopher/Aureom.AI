[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xr-os"
version = "0.1.0"
description = "XR-OS: a modular Python operating layer for spatial computing (AR/VR/MR)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Aureom.AI" }]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pydantic>=2.6",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "websockets>=12.0",
    "cryptography>=42.0",
]

[project.optional-dependencies]
vision = ["opencv-python-headless>=4.9", "torch>=2.2"]
geometry = ["open3d>=0.18"]
dashboard = ["rich>=13.7"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["xr_os*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
