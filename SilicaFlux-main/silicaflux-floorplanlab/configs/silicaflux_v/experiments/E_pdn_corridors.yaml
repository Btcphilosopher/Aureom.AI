# Same arrangement as L_periphery_rows (its reference), with
#   * wider macro corridors: halo 20 -> 30 um, channel 40 -> 80 um
#   * denser core PDN on the signal-routing layer: Metal5 strap pitch
#     75.6 -> 50.4 um (2/3 of the platform pitch, same width; validated)
# Question: congestion / timing effect of corridors vs. routing resources
# consumed by a denser grid.
