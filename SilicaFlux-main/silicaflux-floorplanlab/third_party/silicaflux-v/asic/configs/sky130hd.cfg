LEF_STD=$P/sky130hd/lef/sky130_fd_sc_hd_merged.lef
LEF_MACROS="$P/sky130ram/sky130_sram_1rw1r_128x256_8/sky130_sram_1rw1r_128x256_8.lef"
TECH_DIR=tech/sky130
TIEHI="sky130_fd_sc_hd__conb_1 HI"
