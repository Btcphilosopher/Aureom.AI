P=${PLATFORMS:?set PLATFORMS to <orfs>/flow/platforms}
LIB_STD=$P/sky130hd/lib/sky130_fd_sc_hd__tt_025C_1v80.lib
LIB_MACROS="$P/sky130ram/sky130_sram_1rw1r_128x256_8/sky130_sram_1rw1r_128x256_8_TT_1p8V_25C.lib"
