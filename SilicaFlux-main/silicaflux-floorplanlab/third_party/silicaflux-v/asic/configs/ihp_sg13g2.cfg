# IHP SG13G2 (130 nm BiCMOS, open PDK) standard cells + compiled SRAM macros.
# Collateral from OpenROAD-flow-scripts flow/platforms/ihp-sg13g2.
# Typical corner typ_1p20V_25C.
PDK_NAME=ihp_sg13g2
P=${PLATFORMS:?set PLATFORMS to <orfs>/flow/platforms}
LIB_STD=$P/ihp-sg13g2/lib/sg13g2_stdcell_typ_1p20V_25C.lib
LIB_MACROS="$P/ihp-sg13g2/lib/RM_IHPSG13_1P_2048x64_c2_bm_bist_typ_1p20V_25C.lib $P/ihp-sg13g2/lib/RM_IHPSG13_1P_512x64_c2_bm_bist_typ_1p20V_25C.lib"
LEF_TECH=$P/ihp-sg13g2/lef/sg13g2_tech.lef
LEF_STD=$P/ihp-sg13g2/lef/sg13g2_stdcell.lef
LEF_MACROS="$P/ihp-sg13g2/lef/RM_IHPSG13_1P_2048x64_c2_bm_bist.lef $P/ihp-sg13g2/lef/RM_IHPSG13_1P_512x64_c2_bm_bist.lef"
TECH_DIR=tech/ihp_sg13g2
TIEHI="sg13g2_tiehi L_HI"
TIELO="sg13g2_tielo L_LO"
BUF="sg13g2_buf_2 A X"
CLK_PERIOD_NS=${CLK_PERIOD_NS:-20.0}
SETRC=$P/ihp-sg13g2/setRC.tcl
SITE=CoreSite
HOR_LAYER=Metal3
VER_LAYER=Metal2
STD_UTIL=0.55
MACRO_HALO_UM=15
