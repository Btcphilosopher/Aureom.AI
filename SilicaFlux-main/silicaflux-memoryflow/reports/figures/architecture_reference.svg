<svg viewBox="0 0 980 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="SilicaFlux MemoryFlow memory architecture"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ahd"/></marker><marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ahc"/></marker></defs><style>.blk{fill:var(--d-blk);stroke:var(--d-stroke);stroke-width:1.2}.hot{fill:var(--d-hot);stroke:var(--d-gold);stroke-width:1.6}.ext{fill:none;stroke:var(--d-stroke);stroke-width:1.2;stroke-dasharray:5 4}.t{font:600 13px var(--d-mono);fill:var(--d-text)}.s{font:10.5px var(--d-mono);fill:var(--d-text2)}.ln{stroke:var(--d-line);stroke-width:1.5;fill:none}.lnc{stroke:var(--d-cyan);stroke-width:1.7;fill:none}.ahd{fill:var(--d-line)}.ahc{fill:var(--d-cyan)}.cap{font:600 11px var(--d-mono);fill:var(--d-gold);letter-spacing:.06em}</style><rect class="blk" x="30" y="30" width="200" height="62" rx="6"/><text class="t" x="130.0" y="52" text-anchor="middle">SilicaFlux CPU x1</text><text class="s" x="130.0" y="70" text-anchor="middle">L1 I/D, APB master</text><rect class="ext" x="30" y="380" width="200" height="62" rx="6"/><text class="t" x="130.0" y="402" text-anchor="middle">DDR ctrl + PHY</text><text class="s" x="130.0" y="420" text-anchor="middle">licensed IP (proposed)</text><rect class="ext" x="30" y="480" width="200" height="62" rx="6"/><text class="t" x="130.0" y="502" text-anchor="middle">External DRAM</text><text class="s" x="130.0" y="520" text-anchor="middle">DDR4-3200 x32</text><rect class="blk" x="290" y="30" width="240" height="62" rx="6"/><text class="t" x="410.0" y="52" text-anchor="middle">sf_ctrl_regs</text><text class="s" x="410.0" y="70" text-anchor="middle">perf, ECC inject, MBIST, LP</text><rect class="hot" x="290" y="150" width="240" height="140" rx="6"/><text class="t" x="410.0" y="172" text-anchor="middle">sf_dma</text><text class="s" x="410.0" y="190" text-anchor="middle">4 channels, APB regs, IRQ</text><text class="s" x="410.0" y="205" text-anchor="middle">engine 0: MEM->MEM, MM2S</text><text class="s" x="410.0" y="220" text-anchor="middle">engine 1: S2MM</text><text class="s" x="410.0" y="235" text-anchor="middle">burst 16, 16 outstanding</text><text class="s" x="410.0" y="250" text-anchor="middle">64-bit beats</text><rect class="blk" x="290" y="360" width="240" height="58" rx="6"/><text class="t" x="410.0" y="382" text-anchor="middle">sf_mem_router x2</text><text class="s" x="410.0" y="400" text-anchor="middle">addr decode, in-order rsp</text><rect class="blk" x="600" y="30" width="160" height="70" rx="6"/><text class="t" x="680.0" y="52" text-anchor="middle">sf_vec_unit</text><text class="s" x="680.0" y="70" text-anchor="middle">4 x int16 lanes</text><rect class="blk" x="790" y="30" width="160" height="70" rx="6"/><text class="t" x="870.0" y="52" text-anchor="middle">sf_tensor_array</text><text class="s" x="870.0" y="70" text-anchor="middle">8x8 int8, dbuf acc</text><rect class="blk" x="790" y="160" width="160" height="56" rx="6"/><text class="t" x="870.0" y="182" text-anchor="middle">sf_reuse_buffer</text><text class="s" x="870.0" y="200" text-anchor="middle">ping-pong B replay</text><rect class="hot" x="600" y="300" width="350" height="160" rx="6"/><text class="t" x="775.0" y="322" text-anchor="middle">sf_spm_banked</text><text class="s" x="775.0" y="340" text-anchor="middle">32 KiB, 4 banks x 64 b, modulo</text><rect class="blk" x="610.0" y="362" width="76.5" height="46" rx="3"/><text class="s" x="648.2" y="382" text-anchor="middle">B0</text><text class="s" x="648.2" y="398" text-anchor="middle">ECC</text><rect class="blk" x="694.5" y="362" width="76.5" height="46" rx="3"/><text class="s" x="732.8" y="382" text-anchor="middle">B1</text><text class="s" x="732.8" y="398" text-anchor="middle">ECC</text><rect class="blk" x="779.0" y="362" width="76.5" height="46" rx="3"/><text class="s" x="817.2" y="382" text-anchor="middle">B2</text><text class="s" x="817.2" y="398" text-anchor="middle">ECC</text><rect class="blk" x="863.5" y="362" width="76.5" height="46" rx="3"/><text class="s" x="901.8" y="382" text-anchor="middle">B3</text><text class="s" x="901.8" y="398" text-anchor="middle">ECC</text><text class="s" x="775" y="428" text-anchor="middle">RR arbitration per bank, response credits,</text><text class="s" x="775" y="443" text-anchor="middle">March C- MBIST, ECC counters + injection</text><path class="ln" d="M230,61 L290,61" marker-end="url(#ah)"/><text class="s" x="240" y="55" text-anchor="start">APB</text><path class="ln" d="M258,61 L258,220 L290,220" marker-end="url(#ah)"/><path class="ln" d="M200,92 L200,330 L600,330" marker-end="url(#ah)"/><text class="s" x="212" y="324" text-anchor="start">CPU host (TCM) -> SPM port 2</text><path class="ln" d="M410,290 L410,360" marker-end="url(#ah)"/><text class="s" x="418" y="350" text-anchor="start">SF-MEM rd / wr</text><path class="ln" d="M530,389 L600,389" marker-end="url(#ah)"/><text class="s" x="538" y="382" text-anchor="start">ports 0/1</text><path class="ln" d="M290,400 L230,410" marker-end="url(#ah)"/><text class="s" x="252" y="396" text-anchor="start">EXT</text><path class="ln" d="M130,442 L130,480" marker-end="url(#ah)"/><path class="lnc" d="M530,165 L560,165 L560,112 L650,112 L650,100" marker-end="url(#ahc)"/><text class="s" x="564" y="128" text-anchor="start">so0/so1</text><path class="lnc" d="M530,180 L572,180 L572,122 L830,122 L830,100" marker-end="url(#ahc)"/><text class="s" x="760" y="117" text-anchor="start">so2 (A)</text><path class="lnc" d="M530,196 L790,196" marker-end="url(#ahc)"/><text class="s" x="700" y="191" text-anchor="start">so3 (B)</text><path class="lnc" d="M870,160 L870,100" marker-end="url(#ahc)"/><text class="s" x="876" y="140" text-anchor="start">B</text><path class="lnc" d="M720,100 L720,140 L584,140 L584,250 L530,250" marker-end="url(#ahc)"/><text class="s" x="590" y="246" text-anchor="start">si0</text><path class="lnc" d="M930,100 L930,150 L770,150 L770,270 L530,270" marker-end="url(#ahc)"/><text class="s" x="690" y="266" text-anchor="start">si1 (C)</text><text class="cap" x="290" y="530">RTL REFERENCE PARAMETERISATION</text><text class="s" x="290" y="548">cyan = accelerator streams (valid/ready/last), grey = memory-mapped (SF-MEM / APB)</text></svg>