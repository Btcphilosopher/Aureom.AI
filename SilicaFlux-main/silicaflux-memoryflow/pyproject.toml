[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "silicaflux-memoryflow"
version = "2.0.0"
description = "SilicaFlux MemoryFlow: HBM/SRAM/accelerator-dataflow modelling, RTL and verification toolkit"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "matplotlib>=3.7"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
memoryflow = "memoryflow.cli:main"

[tool.setuptools.packages.find]
include = ["memoryflow*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "rtl: runs Verilator simulations (skipped when verilator is absent)",
  "slow: long-running (full RTL regression, mutation tests)",
]
