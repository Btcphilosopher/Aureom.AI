[workspace]
resolver = "2"
members = [
    "crates/web3emu-types",
    "crates/web3emu-crypto",
    "crates/web3emu-account",
    "crates/web3emu-state",
    "crates/web3emu-tx",
    "crates/web3emu-events",
    "crates/web3emu-trace",
    "crates/web3emu-mempool",
    "crates/web3emu-block",
    "crates/web3emu-contract",
    "crates/web3emu-execution",
    "crates/web3emu-wallet",
    "crates/web3emu-network",
    "crates/web3emu-rpc",
    "crates/web3emu-core",
    "crates/web3emu-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
rand_chacha = "0.3"
hex = "0.4"
thiserror = "1"
clap = { version = "4", features = ["derive"] }
tiny_http = "0.12"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

web3emu-types = { path = "crates/web3emu-types" }
web3emu-crypto = { path = "crates/web3emu-crypto" }
web3emu-account = { path = "crates/web3emu-account" }
web3emu-state = { path = "crates/web3emu-state" }
web3emu-tx = { path = "crates/web3emu-tx" }
web3emu-events = { path = "crates/web3emu-events" }
web3emu-trace = { path = "crates/web3emu-trace" }
web3emu-mempool = { path = "crates/web3emu-mempool" }
web3emu-block = { path = "crates/web3emu-block" }
web3emu-contract = { path = "crates/web3emu-contract" }
web3emu-execution = { path = "crates/web3emu-execution" }
web3emu-wallet = { path = "crates/web3emu-wallet" }
web3emu-network = { path = "crates/web3emu-network" }
web3emu-rpc = { path = "crates/web3emu-rpc" }
web3emu-core = { path = "crates/web3emu-core" }

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 2
