[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "batteryfactory-4-0"
version = "0.1.0"
description = "BATTERYFACTORY 4.0 -- an industrial battery gigafactory digital twin, discrete-event simulator and optimisation platform."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
data = ["pandas>=2.0"]
viz = ["matplotlib>=3.7"]
ml = ["scikit-learn>=1.3"]
opt = ["scipy>=1.10"]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=7.4"]
full = ["batteryfactory-4-0[data,viz,ml,opt,api,dev]"]

[project.scripts]
batteryfactory = "batteryfactory.main:main"

[tool.setuptools.packages.find]
include = ["batteryfactory*"]

[tool.pytest.ini_options]
testpaths = ["batteryfactory/tests"]
# datamodel.models.TestResult is a domain enum (PASS/FAIL/REWORK/REJECT), not a
# pytest test class -- its name just happens to start with "Test".
filterwarnings = ["ignore::pytest.PytestCollectionWarning"]
