[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neurax-gpu-core"
version = "0.1.0"
description = "A modular GPU architecture R&D and performance simulation engine."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.7"]
ai = ["torch>=2.0"]
dev = ["pytest>=7.4"]

[project.scripts]
neurax-gpu-core = "neurax_gpu_core.main:main"

[tool.setuptools.packages.find]
include = ["neurax_gpu_core*"]

[tool.pytest.ini_options]
testpaths = ["neurax_gpu_core/tests"]
