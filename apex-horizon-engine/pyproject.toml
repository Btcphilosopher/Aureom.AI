[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apex-horizon-engine"
version = "0.1.0"
description = "APEX HORIZON ENGINE -- a modular open-world American futurist racing game engine."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
viz = ["matplotlib>=3.7"]
dev = ["pytest>=7.4"]

[project.scripts]
apex-horizon-engine = "apex_horizon_engine.main:main"

[tool.setuptools.packages.find]
include = ["apex_horizon_engine*"]

[tool.pytest.ini_options]
testpaths = ["apex_horizon_engine/tests"]
